name: VPS CI

# This repository is public. Keep this workflow push-only so code from fork
# pull requests can never execute on the production-adjacent self-hosted runner.
"on":
  push:
    branches:
      - "**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vps-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python, frontend, and production build
    runs-on: [self-hosted, linux, x64, miraj-ci]
    timeout-minutes: 30
    env:
      CI: "true"
      JWT_SECRET_KEY: ci-test-key-not-for-production
      MPLBACKEND: Agg
      PYTHONUNBUFFERED: "1"

    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          clean: true
          # A frontend design-token regression test diffs against its recorded
          # baseline commit, so CI needs repository history for that assertion.
          fetch-depth: 0
          persist-credentials: false

      - name: Install Python dependencies
        run: |
          python3 -m venv .venv-ci
          . .venv-ci/bin/activate
          python -m pip install --disable-pip-version-check --upgrade pip
          python -m pip install --disable-pip-version-check \
            -r requirements.txt \
            -r requirements-dash.txt \
            pytest \
            pytest-asyncio

      - name: Run deterministic Python suites
        run: |
          . .venv-ci/bin/activate
          bash scripts/ci_python_tests.sh

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Run frontend tests
        working-directory: frontend
        run: npm test -- --runInBand

      - name: Build the production frontend
        working-directory: frontend
        run: npm run build
